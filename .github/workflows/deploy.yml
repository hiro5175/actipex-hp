name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: actipex.com
  CLOUDFRONT_DISTRIBUTION_ID: EK2RJ0VBWF9MM

jobs:
  test:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Lint
        working-directory: src
        run: npm run lint

      - name: Typecheck
        working-directory: src
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build (static export)
        working-directory: src
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: site-export
          path: src/out
          retention-days: 1

  deploy:
    name: Deploy to S3 + CloudFront
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: site-export
          path: out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::194757613128:role/actipex-hp-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync out/ "s3://${{ env.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
